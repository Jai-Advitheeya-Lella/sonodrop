# Builds the Linux packages and attaches them to a GitHub Release.
# To publish a version: bump "version" in package.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # bsdtar builds the Arch package, rpm the Fedora one.
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: npm ci
      - run: npx install-electron
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage deb pacman rpm tar.gz --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sonodrop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
            dist/*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            Open a terminal, paste this line and press Enter:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Jai-Advitheeya-Lella/sonodrop/master/install.sh | bash
            ```

            Then open **Sonodrop** from your application menu. Works on any 64-bit Linux desktop, including Bazzite and SteamOS. The same line updates it later.

            Prefer a native package? Pick the `.deb` (Debian/Ubuntu), `.rpm` (Fedora), `.pacman` (Arch) or `.AppImage` below.
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
            dist/*.tar.gz
